name: cubic_technical_asses
description: SAIB Mobile Banking - Flutter Developer Assessment
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Routing
  go_router: ^17.5.0

  # DI
  get_it: ^9.2.1

  # Networking
  dio: ^5.4.3

  # Local / secure storage
  flutter_secure_storage: ^11.0.0

  # Device identity (DeviceId / DeviceModel for auth requests)
  device_info_plus: ^13.2.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  pretty_dio_logger: ^1.4.0
  android_id: ^0.5.2+1

  # UI helpers
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.6
  file_picker: ^12.0.0
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/